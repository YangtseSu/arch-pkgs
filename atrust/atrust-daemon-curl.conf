[Service]
# The system Qt5Network pulls libcurl.so.4 (an OpenSSL 3 build) in through libproxy, and it
# enters aTrustAgent before the bundled resources/bin/libcurl.so. The client's curl_*
# references carry no symbol versions, so they bind to the system copy, which then hands an
# OpenSSL 3 object to the client's OpenSSL 1.1 SSL callbacks, and the daemon segfaults and
# restarts about every 35 seconds (through X509_VERIFY_PARAM_set_depth).
# Preloading the bundled libcurl makes it the first curl in the global scope; libproxy's
# reference to the system curl carries the CURL_OPENSSL_4 version requirement, so proxy
# detection keeps using the system copy.
Environment=LD_PRELOAD=/usr/share/sangfor/aTrust/resources/bin/libcurl.so
