[Service]
# The vendor unit uses KillMode=process, so at shutdown only the main process is terminated.
# The client also starts low-privilege core plugins and tunnel children (aTrustXtunnel-64 and
# friends) that ignore SIGTERM: in a container measurement 4 of 12 processes needed SIGKILL.
# The survivors keep /home and /tmp busy and systemd-shutdown waits a long time before it can
# unmount the file systems. The vendor unit's own comment says the stop timeout exists to keep
# shutdown from blocking, but KillMode=process does not achieve that.
KillMode=control-group
