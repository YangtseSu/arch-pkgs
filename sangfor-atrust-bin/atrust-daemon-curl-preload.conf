[Service]
# Arch 上系统 Qt5Network 会经 libproxy 拉入 libcurl.so.4 (OpenSSL 3 构建), 它先于
# 客户端自带的 resources/bin/libcurl.so 进入 aTrustAgent 的全局作用域; 客户端对
# curl_* 的引用不带版本节点, 于是它自己的 SSL_CTX 回调 (按 OpenSSL 1.1 写) 拿到
# OpenSSL 3 的对象, X509 验证参数成了废指针 —— daemon 每 ~35 秒 SIGSEGV 重启。
# 预加载自带 libcurl 让它成为全局作用域里第一个 curl; libproxy 对系统 curl 的引用
# 带 CURL_OPENSSL_4 版本要求, 仍会落到系统 curl, 代理探测不受影响。
# 只影响 aTrustDaemon 及其子进程; 卸载本包即还原。
Environment=LD_PRELOAD=/usr/share/sangfor/aTrust/resources/bin/libcurl.so
